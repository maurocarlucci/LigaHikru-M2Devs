<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LigaHikru - Documentos AI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 900px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .tabs {
            display: flex;
            background: #f5f5f5;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab-content {
            flex: 1;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .tab-content.active {
            display: flex;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 70%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
        }

        .citations {
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
            font-size: 12px;
        }

        .citation {
            margin: 5px 0;
            padding: 5px;
            background: white;
            border-left: 3px solid #667eea;
            padding-left: 10px;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        .input-area input,
        .input-area textarea {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .input-area input:focus,
        .input-area textarea:focus {
            border-color: #667eea;
        }

        .input-area textarea {
            resize: none;
            min-height: 60px;
            border-radius: 10px;
        }

        .btn {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
        }

        .search-result {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .search-result:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .result-title {
            font-weight: 600;
            color: #667eea;
        }

        .result-score {
            background: #667eea;
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
        }

        .result-content {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .result-link {
            color: #667eea;
            text-decoration: none;
            font-size: 12px;
        }

        .result-link:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            margin-bottom: 20px;
        }

        .upload-area:hover {
            background: #f0f0f0;
        }

        .upload-area.dragover {
            background: #e8e8ff;
            border-color: #5568d3;
        }

        #fileInput {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 LigaHikru - Documentos AI</h1>
            <p>Consulta y busca información en tus documentos internos</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="switchTab('ask')">💬 Preguntar</button>
            <button class="tab" onclick="switchTab('search')">🔍 Buscar</button>
            <button class="tab" onclick="switchTab('upload')">📤 Subir</button>
        </div>

        <!-- Tab: Preguntar -->
        <div id="askTab" class="tab-content active">
            <div class="chat-messages" id="chatMessages"></div>
            <div class="input-area">
                <input type="text" id="questionInput" placeholder="Haz una pregunta sobre los documentos..." 
                       onkeypress="if(event.key === 'Enter') askQuestion()">
                <button class="btn" onclick="askQuestion()">Enviar</button>
            </div>
        </div>

        <!-- Tab: Buscar -->
        <div id="searchTab" class="tab-content">
            <div class="input-area" style="margin-bottom: 20px;">
                <input type="text" id="searchInput" placeholder="Buscar en documentos..." 
                       onkeypress="if(event.key === 'Enter') searchDocuments()">
                <button class="btn" onclick="searchDocuments()">Buscar</button>
            </div>
            <div class="search-results" id="searchResults"></div>
        </div>

        <!-- Tab: Subir -->
        <div id="uploadTab" class="tab-content">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()" 
                 ondrop="handleDrop(event)" ondragover="handleDragOver(event)" ondragleave="handleDragLeave(event)">
                <p>📄 Arrastra un archivo aquí o haz clic para seleccionar</p>
                <p style="font-size: 12px; color: #666; margin-top: 10px;">Soporta PDF, TXT, MD</p>
            </div>
            <input type="file" id="fileInput" accept=".pdf,.txt,.md" onchange="handleFileSelect(event)">
            <div id="uploadStatus"></div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8000/api';

        function switchTab(tabName) {
            // Ocultar todos los tabs
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Mostrar tab seleccionado
            document.getElementById(tabName + 'Tab').classList.add('active');
            event.target.classList.add('active');
        }

        async function askQuestion() {
            const input = document.getElementById('questionInput');
            const question = input.value.trim();
            
            if (!question) return;

            // Agregar pregunta al chat
            addMessage('user', question);
            input.value = '';

            // Mostrar loading
            const loadingId = addMessage('assistant', '<div class="spinner"></div><div class="loading">Pensando...</div>', true);

            try {
                const response = await fetch(`${API_BASE}/chat/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        question: question,
                        max_results: 5,
                        temperature: 0.7
                    })
                });

                const data = await response.json();

                // Remover loading
                document.getElementById(loadingId).remove();

                // Agregar respuesta
                let citationsHtml = '';
                if (data.citations && data.citations.length > 0) {
                    citationsHtml = '<div class="citations"><strong>Fuentes:</strong>';
                    data.citations.forEach(cit => {
                        citationsHtml += `<div class="citation">📄 ${cit.document_name} (página ${cit.page_number || 'N/A'}) - Relevancia: ${(cit.score * 100).toFixed(1)}%</div>`;
                    });
                    citationsHtml += '</div>';
                }

                addMessage('assistant', data.answer + citationsHtml);
            } catch (error) {
                document.getElementById(loadingId).remove();
                addMessage('assistant', '❌ Error: ' + error.message);
            }
        }

        async function searchDocuments() {
            const input = document.getElementById('searchInput');
            const query = input.value.trim();
            
            if (!query) return;

            const resultsDiv = document.getElementById('searchResults');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Buscando...</p></div>';

            try {
                const response = await fetch(`${API_BASE}/chat/search`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        query: query,
                        max_results: 10
                    })
                });

                const data = await response.json();
                resultsDiv.innerHTML = '';

                if (data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="loading">No se encontraron resultados</div>';
                    return;
                }

                data.results.forEach(result => {
                    const resultDiv = document.createElement('div');
                    resultDiv.className = 'search-result';
                    resultDiv.innerHTML = `
                        <div class="result-header">
                            <span class="result-title">${result.document_name}</span>
                            <span class="result-score">${(result.score * 100).toFixed(1)}% relevante</span>
                        </div>
                        <div class="result-content">${result.content.substring(0, 300)}${result.content.length > 300 ? '...' : ''}</div>
                        ${result.source_url ? `<a href="${result.source_url}" target="_blank" class="result-link">Ver documento →</a>` : ''}
                    `;
                    resultsDiv.appendChild(resultDiv);
                });
            } catch (error) {
                resultsDiv.innerHTML = `<div class="loading">❌ Error: ${error.message}</div>`;
            }
        }

        function addMessage(role, content, isLoading = false) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageId = 'msg-' + Date.now();
            const messageDiv = document.createElement('div');
            messageDiv.id = messageId;
            messageDiv.className = `message ${role}`;
            messageDiv.innerHTML = `<div class="message-content">${content}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return messageId;
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        function handleDragOver(event) {
            event.preventDefault();
            event.currentTarget.classList.add('dragover');
        }

        function handleDragLeave(event) {
            event.currentTarget.classList.remove('dragover');
        }

        function handleDrop(event) {
            event.preventDefault();
            event.currentTarget.classList.remove('dragover');
            const file = event.dataTransfer.files[0];
            if (file) {
                uploadFile(file);
            }
        }

        async function uploadFile(file) {
            const statusDiv = document.getElementById('uploadStatus');
            statusDiv.innerHTML = '<div class="loading"><div class="spinner"></div><p>Subiendo y procesando documento...</p></div>';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_BASE}/documents/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok) {
                    statusDiv.innerHTML = `
                        <div style="background: #d4edda; color: #155724; padding: 15px; border-radius: 10px; margin-top: 20px;">
                            <strong>✅ ${data.message}</strong><br>
                            <small>Archivo: ${data.filename}<br>
                            Chunks procesados: ${data.chunks_processed}</small>
                        </div>
                    `;
                } else {
                    throw new Error(data.detail || 'Error subiendo archivo');
                }
            } catch (error) {
                statusDiv.innerHTML = `
                    <div style="background: #f8d7da; color: #721c24; padding: 15px; border-radius: 10px; margin-top: 20px;">
                        <strong>❌ Error:</strong> ${error.message}
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
